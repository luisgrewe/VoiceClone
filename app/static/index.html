<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>VoiceClone</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <h1>VoiceClone</h1>
    <p class="sub"><span id="keyDot" class="status-dot"></span><span id="statusLine">Checking…</span></p>

    <div id="loginCard" class="card hidden">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="primary" id="loginBtn" type="button">Unlock</button>
      <p id="loginError" class="error hidden"></p>
    </div>

    <div id="app" class="hidden">
      <div class="tabs">
        <button type="button" class="active" data-tab="studio">Studio</button>
        <button type="button" data-tab="setup">Voice setup</button>
      </div>

      <section id="studio">
        <div class="card">
          <label for="script">Script</label>
          <textarea id="script" placeholder="Paste the exact words you want spoken."></textarea>
          <div class="meta">
            <span id="charCount">0 chars</span>
            <span id="estTime" class="marks">~0s</span>
          </div>
          <label for="voice">Voice</label>
          <select id="voice"></select>
          <div class="row">
            <div>
              <label for="model">Model</label>
              <select id="model"></select>
            </div>
            <div>
              <label for="format">File</label>
              <select id="format">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
              </select>
            </div>
          </div>
          <label for="speed">Speed <span id="speedVal">1.00</span></label>
          <input id="speed" type="range" min="0.7" max="1.4" step="0.05" value="1">
          <label for="volume">Volume <span id="volumeVal">0</span></label>
          <input id="volume" type="range" min="-10" max="10" step="1" value="0">
          <button class="primary sticky-gen" id="generateBtn" type="button">Generate</button>
          <p id="genError" class="error hidden"></p>
          <div id="playerBox" class="hidden">
            <audio id="player" controls></audio>
            <a id="downloadLink" class="primary" style="display:block;text-align:center;text-decoration:none;line-height:44px">Download</a>
          </div>
        </div>
        <div class="card">
          <p class="label">History</p>
          <ul id="history" class="history"></ul>
        </div>
      </section>

      <section id="setup" class="hidden">
        <div class="card">
          <label for="voiceTitle">Name</label>
          <input id="voiceTitle" type="text" placeholder="My voice">
          <label for="sampleFile">Audio samples (10s–2 min each, clean speech)</label>
          <input id="sampleFile" class="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.opus" multiple>
          <label for="transcripts">Optional transcripts (one line per sample)</label>
          <textarea id="transcripts" placeholder="The exact words spoken in sample 1" style="min-height:88px"></textarea>
          <p class="sub">Or record a sample on this phone:</p>
          <div class="actions">
            <button id="recBtn" type="button">Record</button>
            <button id="stopBtn" type="button" disabled>Stop</button>
          </div>
          <audio id="preview" class="hidden" controls></audio>
          <button class="primary" id="enrollBtn" type="button" style="margin-top:12px">Create voice</button>
          <p id="enrollError" class="error hidden"></p>
          <p id="enrollOk" class="ok hidden">Voice saved. Use it in Studio.</p>
        </div>
        <div class="card">
          <p class="label">Saved voices</p>
          <ul id="voiceList" class="history"></ul>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
